  - version: v31
    date: 2026-09-02
    # COOKING-SESSION CRAFT SPRINT (marker: cooking-session-craft-014-018).
    # Five items land in cooking's TWO EXISTING lanes -- no new lane, no
    # registry change. Item 014 is @food-safety (VC-F); items 015-018 are
    # @test-kitchen (VC-E). Lane follows the verification culture of each
    # item's content, not the sprint theme, and item 014 is filed first for
    # that reason: every craft item that follows defers to it by ID rather
    # than re-deriving a safety rule.
    #
    # WHY. A live cooking-session module that back-calculates a timeline from
    # a target serving time needs answers this domain's existing 13 items did
    # not carry: whether a finished dish waiting on the stove is free or
    # costing a clock, which dishes tolerate schedule slack and why, what it
    # means for a target to be provably impossible rather than merely tight,
    # what a recipe's step order leaves out that a real kitchen imposes, and
    # where to put buffer and on what basis. None of that is in the existing
    # Korean food-safety and test-kitchen items, and all five follow directly
    # from mechanism plus jurisdiction rather than from taste or habit.
    #
    # THE FENCE, stated first because every other item in this batch is
    # conditional on it. Item 014 (@food-safety, KR, A) publishes Korea's
    # Ministry of Food and Drug Safety holding rule -- hot food at or above
    # 60C is free to hold, food below that line is on a two-hour clock, not
    # spending schedule slack -- plus the Clostridium perfringens mechanism
    # (43-47C growth optimum, heat-resistant spore, so boiled food can grow
    # it again) that explains why the DESCENT through the danger zone matters
    # more than the cooking itself. Every craft item below is written to defer
    # to this fence by ID rather than to restate or soften it.
    #
    # THE CRAFT CONTENT (015-018, @test-kitchen). 015 gives the two-question
    # physical test for whether a dish tolerates delay -- is it temperature-
    # pinned by boiling liquid, and does its finished state decay
    # irreversibly -- and states explicitly that pinning is a fact about the
    # POT, not a safety verdict about the FOOD; holding is free only at or
    # above item 014's 60C floor. 016 grounds the timeline builder's hard
    # invariant (never shorten a stated cooking time to make a schedule fit)
    # in the definitional properties of a backward-pass schedule, and shows
    # why the invariant is a SAFETY rule here, not a style rule: Korean
    # guidance specifies time AT a temperature, so trimming a duration lowers
    # a safety parameter. 017 proves, without needing a measurement, that a
    # timeline built from recipe ordering alone is a LOWER BOUND on elapsed
    # time (equipment and attention are constraints a recipe never declares),
    # and enumerates the recurring hard barriers (coming to a boil, coming to
    # temperature, thawing, soaking, drying a surface) without inventing
    # durations for any of them. 018 separates the one buffer justification
    # that needs no evidence (a sum over a subset of non-negative durations is
    # a lower bound) from the one that is popularly over-applied (the planning
    # fallacy), and shows via the primary 2012 review that the famous 1994
    # result is a COMPLETION-TIME finding being misapplied to a
    # PERFORMANCE-TIME question -- so a module may not pad the user's stated
    # cooking times by a blanket factor on that authority.
    #
    # SOURCING. Item 014 from the Ministry of Food and Drug Safety's own
    # government policy portal (korea.kr), retrieved and read directly. Items
    # 016-018 from an open project-management textbook (cited as a
    # DEFINITION source, not an empirical one) and the 1994 Buehler primary
    # plus the 2012 Halkjelsvik and Jorgensen review (abstract only,
    # explicitly marked as such). No recipe blog, cooking-show assertion, or
    # unsourced content-farm claim anywhere in the batch.
    #
    # NO applicability.axes ON ANY OF THE FIVE, following the v15 precedent:
    # the axes ledger is fitness-shaped and a cooking-session module's real
    # axes (allergen exposure, who is at the table, appliance capability,
    # thermometer availability) do not exist in it. Flagged again in GAPS.md
    # rather than added in a content-only release.
    #
    # CONTESTED FLAGS: 1 of 5 (item 018), on the behavioural half only -- the
    # deterministic lower-bound argument in the same item is not in dispute.
    #
    # Per-item one-liners:
    #   014 session-holding-fence (A, @food-safety, KR) -- the 60C/5C/2-hour
    #       holding rule and the Clostridium perfringens mechanism that
    #       explains why the descent, not the cooking, is where the risk sits.
    #   015 session-slack-classes (C, @test-kitchen) -- the pinned/unpinned x
    #       slow-decay/fast-decay test for schedule tolerance, hard-fenced to
    #       014's 60C floor and shipping no slack NUMBER because none was
    #       measured.
    #   016 timeline-backward-pass (B, @test-kitchen) -- forward/backward pass
    #       and float as definitions; negative float is a proof of
    #       infeasibility, not a warning level; shortening a duration is
    #       lowering a safety parameter in this domain, not a fourth repair.
    #   017 parallelism-resource-claim (C, @test-kitchen) -- ordering-only
    #       timelines are a provable LOWER BOUND once equipment and attention
    #       capacity are considered; barriers enumerated, no durations
    #       invented; attention flagged as the resource that fails silently.
    #   018 duration-estimate-asymmetry (B, contested, @test-kitchen) -- the
    #       arithmetic case for buffer needs no evidence; the planning-fallacy
    #       case is a completion-time finding and must not be applied to
    #       performance-time cooking durations, including the detail that a
    #       pessimistic re-ask did not fix the bias in the primary study.
    added:
      - cooking/session-holding-fence-014
      - cooking/session-slack-classes-015
      - cooking/timeline-backward-pass-016
      - cooking/parallelism-resource-claim-017
      - cooking/duration-estimate-asymmetry-018
    changed: []
    retracted: []
    grade_transitions: []
    domain_transitions: []
    lane_transitions: []
  - version: v30
    date: 2026-09-02
    # MENTAL-HEALTH CRAFT LANE OPENING (marker: mh-craft-lane-021-028). Eight
    # items land in a NEW lane, @assistant-craft (VC-E), appended to lanes.yaml.
    # No registry change: mental-health is already an active domain.
    #
    # THE GAP THIS CLOSES. mental-health landed 20 items earlier today and every
    # one of them is @clinical (VC-A) -- what is ESTABLISHED about people. The
    # consumer is a generalist life agent that sees the owner's daily blocks,
    # sleep, energy and workload, and the question it faces several times a day
    # is not what is established but how to BEHAVE in the presence of what is
    # established. None of that is in a paper. It is the same structural gap the
    # exercise domain already solved with @gym-craft, whose items carry setup,
    # form and what-to-do-when knowledge that no trial produces.
    #
    # VC-E, matching @gym-craft and @test-kitchen. The verification basis is
    # operational practice inside ONE estate: unblinded, uncontrolled, n of one,
    # no counterfactual, no measured outcome. Item 021 states that as the lane's
    # ceiling and refuses to let any item exceed it. VC-C was considered and
    # rejected -- nothing here is a finding about people, so filing it under an
    # evidence culture would imply a study that does not exist.
    #
    # THE DOOR RULE, which is the reason item 021 exists and is authored first.
    # A craft lane opened next to an evidence lane that has just refused a large
    # body of popular material is a re-entry door for exactly that material. It
    # is closed. Refused in the @clinical lane and STILL REFUSED here, at full
    # strength: gratitude journalling as evidence-backed (item 017),
    # positive-psychology effect sizes at their published values (017), willpower
    # or self-control budgeting as a scheduling input (019), and any inference of
    # how somebody feels from tracked behavioural data (013). The clinical
    # boundary is inherited unchanged -- no diagnosis, no screening, no risk
    # assessment, no crisis handling, no treatment selection -- as is item 011's
    # operative rule that no score, threshold or tracked signal may be converted
    # into a claim about a person's state. Every one of the eight items obeys
    # 011 rather than softening it, and three of them exist mainly to enforce it.
    #
    # A NEW SOURCE FORM, declared rather than smuggled: `incident:`. Item 023's
    # primary basis is a documented operational failure in this estate on
    # 2026-08-28, recorded with its numbers, its root cause and its unresolved
    # residue. A craft lane needs a way to cite something learned by failing at
    # it, and the alternative -- dressing the incident up as a `framework:` note
    # -- would hide the weakest and most useful thing about the citation.
    #
    # NO applicability.axes ON ANY OF THE EIGHT. A deliberate M-3 tiering call.
    # These items are rules about the assistant's own conduct and do not
    # personalize on any axis; the ledger is untouched by this release, as are
    # tools/, axes.yaml, registry.yaml and the e/ records.
    #
    # SPLIT GRADES throughout, following the @clinical lane's own convention.
    # Each item's craft content sits at the practitioner floor, and where an item
    # implements a constraint established elsewhere the constraint is named with
    # ITS band and attributed to the item that established it, so the machine
    # record cannot be read as the craft item borrowing that standing.
    #
    # Per-item one-liners:
    #   021 craft-verification-ceiling -- the lane's anchor, authored first. The
    #       ceiling (operational practice, one estate, no measured outcome), the
    #       three-condition admission test, the door rule naming the four refused
    #       claims that stay refused, and the inherited clinical boundary.
    #   022 observation-without-diagnosis -- the sentence-level mechanics of item
    #       013's "ask, never conclude". Four failure shapes that each survive a
    #       naive self-check (smuggled state word, causal arrow, invented
    #       threshold, concerned register), each with a rewrite; plus the
    #       when-to-say-nothing test (a decision must sit downstream) and the
    #       say-it-once rule.
    #   023 absent-record-is-not-an-event -- three record states not two, absence
    #       has non-random causes, and the accusation asymmetry. Basis is a
    #       documented 2026-08-28 incident in this estate: an automated check
    #       reported rate=0.0 / 4 consecutive misses for a series that was
    #       actually 8 of 9 done, and it was relayed to the owner three times
    #       before he corrected it from memory. The engineering defect has its
    #       own ticket; what is recorded here is the conduct half, which no code
    #       fix removes.
    #   024 conversation-is-not-a-sensor -- the assistant's OWN channel (message
    #       length, latency, curtness, hour, typos) is a behavioural feature
    #       stream, and the one the sensing literature does not cover because
    #       there the observer is outside the exchange. Flat prohibition on
    #       branching behaviour on inferred affect, with one carve-out whose
    #       whole content is authorship: a standing instruction the person wrote
    #       is obedience, not inference.
    #   025 activity-support-without-coercion -- what the assistant may do on the
    #       calendar (keep chosen things visible, make restarting cheap) and the
    #       three prohibitions that carry equal weight: never therapeutic, never
    #       guilt-based, never willpower-budgeted. Item 010's hard boundary is
    #       restated at the top band and none of its standing is borrowed.
    #   026 detachment-is-a-schedule-property -- the decomposition that makes
    #       this topic workable: detachment as studied is a psychological state
    #       and is off limits, but whether an interval contains no work object is
    #       a property of a calendar and asserts nothing about anyone. Adds the
    #       empty-slot rule (an unowned gap is reclaimed by default) and the
    #       lever nobody counts -- the assistant is itself a work object, so its
    #       own delivery schedule is part of the quantity it is measuring.
    #   027 scope-when-the-owner-reports-feeling-bad -- mostly a list of what is
    #       NOT in scope, authored that way deliberately. The first rule is the
    #       mirror of item 011: a person's own account of their state must not be
    #       converted into a rating, metric or trend. Referral carve-out worded
    #       narrowly (a lookup somebody asked for is a lookup; an unrequested
    #       routing decision is an assessment), with item 020's rising-stigma
    #       measurement as the reason that is not a harmless default here.
    #   028 long-run-observation-without-surveillance -- the retention rules,
    #       which outlive every conversation and are therefore the part nobody
    #       reviews. Strongest rule: surface on a cadence the person set, never
    #       on a threshold the assistant chose, because a threshold-triggered
    #       surfacing is a state claim delivered by TIMING and perfect wording
    #       cannot undo it. Item 012 supplies why length is not strength.
    #
    # WHAT WAS REFUSED (the full ledger is in GAPS.md and the refusals are the
    # more important half of this release):
    #   - crisis handling / risk escalation conduct -- out-of-scope-by-design,
    #     inherited unchanged. Even the craft version needs a risk assessment to
    #     trigger it.
    #   - supportive-communication technique (reflective listening, validation
    #     moves) -- REFUSED. Counselling micro-skills in conversational costume.
    #   - mood check-in / daily affect logging design -- REFUSED, and blocked on
    #     a gap this domain already recorded: no meta-analytic anchor exists on
    #     whether repeatedly asking someone to rate their mood changes it.
    #   - early burnout detection, in any form -- REFUSED twice over (item 015's
    #     142 definitions, and detection is risk assessment).
    #   - agent-initiated gratitude or journalling prompts -- REFUSED at the
    #     door. This is the exact material item 017 rejected, and "it is only a
    #     helpful thing to offer" is the re-admission argument item 021 exists
    #     to block.
    #   - willpower-budgeted day planning -- REFUSED (item 019).
    #   - storing a sentiment or tone score over the owner's messages -- REFUSED
    #     (item 024 states this as its own prohibition).
    #   - behaviour-change-technique taxonomies / nudge design -- NOT researched
    #     and deliberately not filled from practitioner blogs.
    added:
      - mental-health/craft-verification-ceiling-021
      - mental-health/observation-without-diagnosis-022
      - mental-health/absent-record-is-not-an-event-023
