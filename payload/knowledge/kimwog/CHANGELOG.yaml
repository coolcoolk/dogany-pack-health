    # authors, journal, volume, pages, year and a resolvable DOI. No
    # productivity book, no blog post, no press summary is used as a source
    # anywhere in this lane. Ten sources were downloaded and read in FULL TEXT
    # rather than trusted from an abstract, because in this domain the abstract
    # routinely omits the number the popular claim rests on: Buehler 1994 (the
    # pessimistic-prediction table), Flyvbjerg 2002 (the per-project-type
    # escalation table), Sheeran 2024 (the Robust Bayesian correction), Mark
    # 2005 (the resumption figures), Mark 2008 (read specifically to establish
    # an absence), Rubinstein 2001 (read cover to cover to establish an
    # absence), Altmann 2014, Aeon 2021 (Tables 4-7), Parry 2021 (the 6.12%
    # accuracy figure), Steel 2007 (Tables 3-5), and Ghibellini 2025 (the
    # leave-the-founder's-data-out split).
    #
    # THE DOMAIN-SPECIFIC HAZARD, which drove every grading decision here: this
    # is the warehouse's widest gap between popular authority and evidential
    # strength -- wider than the relationships lane, because the transmission
    # channel is commercial rather than clinical. Famous claims here are
    # load-bearing in books that sell, so they circulate with more confidence
    # and less provenance than anywhere else in the warehouse. The sprint's
    # operating rule was the relationships lane's: refusing a famous claim with
    # a stated reason beats shipping it. Eleven widely circulating claims were
    # researched and NOT shipped as stated, plus one new ledger category; the
    # full ledger is in GAPS.md, and it is longer than several domains' entire
    # item lists.
    #
    # WHAT WAS TRACED TO SOURCE AND DID NOT SURVIVE (headline list; full detail
    # in GAPS.md):
    #   - "It takes 23 minutes 15 seconds to refocus after an interruption."
    #     Both Mark papers it is attributed to were downloaded and read. Neither
    #     contains it, or any refocus-time figure. What IS measured is 25 min
    #     26 s of ELAPSED time before resumption, with a standard deviation of
    #     54 min 48 s. Item 004.
    #   - "Multitasking costs up to 40 percent of your productive time." The
    #     35-page primary was read cover to cover. The figure is not in it, and
    #     the paper contains no workday against which a percentage could be
    #     taken; its measured costs are sub-second. Item 006.
    #   - The 25-minute Pomodoro interval. No primary study establishes it. The
    #     one located trial of a Pomodoro-style schedule ran 24/6, not 25/5, and
    #     found no difference in effort or task completion. Items 012 and 015.
    #   - Implementation intentions at d = .65. Superseded BY ITS OWN AUTHORS:
    #     642 tests give d = .36 raw, substantial publication bias, and a Robust
    #     Bayesian estimate of d = .15. Item 003.
    #   - The Zeigarnik effect. First meta-analysis, 59 studies: no memory
    #     advantage once the founder's own data is removed. The resumption half
    #     survives at 67%. Item 011.
    #   - "Procrastination is perfectionism." r = -.03 across 24 studies and
    #     3,884 people. Item 013.
    #   - GTD and the Eisenhower matrix. Neither has a primary test. Refused
    #     outright, not shipped at a low grade. See GAPS.md.
    #   - Any specific work-block length, break length, daily task count or
    #     number of priorities. Zero primary sources located. Shipped as an
    #     explicit absence row (015) rather than left silent, because a gap-file
    #     entry does not fire at answer time and an item does.
    #
    # THE LIVE FAILURE THIS LANE EXISTS TO PREVENT. In this system, an anomaly
    # detector read "not yet marked done" as "did not do it" and pushed a false
    # accusation at the owner. Item 009 is the sourced fence: in a randomised
    # comparison with a covert sensor under the record, 32 pct of days contained
    # no diary opening at all while reported compliance for those same days was
    # 92 pct. The gap between a record and a fact opens in BOTH directions, and
    # an unmarked item licenses a question, never a conclusion.
    #
    # LOCALE CHECK (mandated). REFUSED, and recorded as a searched absence: no
    # Korean-primary behavioural or intervention study in this domain was
    # located. The only Korean-primary source found is a translation and
    # validation of procrastination SCALES, which could not be retrieved in this
    # pass and is a measurement instrument rather than a finding. No KR row is
    # shipped. See GAPS.md.
    #
    # Per-item one-liners:
    #   001 planning-fallacy-own-estimates (B) -- Buehler 1994, objectively
    #       recorded submission dates: predicted 33.9 days, actual 55.5, only
    #       29.7 pct finished inside their own estimate. The half nobody
    #       repeats: instructing people to be PESSIMISTIC did not improve
    #       absolute accuracy (23.2 vs 22.6 days of error).
    #   002 reference-class-base-rate (B) -- Flyvbjerg 2002, 258 projects:
    #       86 pct overrun probability, rail 44.7 / links 33.8 / roads 20.4 pct,
    #       and NO improvement over 70 years. The outside-view anchor.
    #   003 implementation-intentions-effect-shrinks (B, contested) -- the
    #       correction published by the original authors.
    #   004 interruption-resumption-measured (C) -- what was actually measured
    #       about interrupted work; carries the 23-minute refusal.
    #   005 momentary-interruption-error-cost (B) -- Altmann 2014: 2.8 s doubles
    #       and 4.4 s triples sequence errors. The cost is errors, not minutes,
    #       and no time log can see it.
    #   006 switch-cost-not-a-productivity-percentage (B) -- verified negative.
    #   007 time-management-effect-modest (B) -- Aeon 2021, 158 studies: work
    #       performance r = .259 falling to .188 after bias correction, wellbeing
    #       r = .313, life satisfaction r = .426 against job satisfaction .248.
    #       It moves how life feels more than what gets produced.
    #   008 self-report-vs-log-divergence (B) -- Parry 2021: r = 0.38, and only
    #       6.12 pct of comparisons within 5 pct of the log. Errors run BOTH
    #       ways, so there is no correction factor to apply.
    #   009 record-is-not-behaviour (B) -- the sourced fence against reading an
    #       empty field as a fact.
    #   010 target-corruption-completion-metrics (D) -- named hazard, no effect
    #       size asserted, and the sourcing limit stated in the item itself.
    #   011 zeigarnik-recall-refuted (B) -- memory half refuted, resumption half
    #       survives at 67 pct.
    #   012 breaks-wellbeing-not-performance (B) -- vigour and fatigue move,
    #       performance does not (d = 0.16, ns); the only significant duration
    #       moderator favours LONGER breaks.
    #   013 procrastination-predictors (C) -- Steel 2007, 691 correlations. The
    #       operationally decisive one: INTENTION correlates r = -.03 with
    #       procrastination.
    #   014 goal-setting-side-effects-contested (D, contested) -- a live
    #       published dispute, recorded rather than adjudicated. No effect size
    #       asserted because none was verified.
    #   015 no-block-length-or-task-count-evidence (D) -- deliberate absence
    #       row. Explicitly NOT a demonstrated null.
    #   016 curator-checklist (D) -- the lane's grading rule and its eight
    #       refusal triggers, every one of which fired in this sprint.
    added:
      - task-management/planning-fallacy-own-estimates-001
      - task-management/reference-class-base-rate-002
