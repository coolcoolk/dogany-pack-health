    # should be. The field's most-cited number (ACSM 2009's 2-10%) was traced to
    # its single citation and that citation is a narrative prescription review,
    # not an experiment; the 2026 ACSM update is silent on the topic (recorded
    # explicitly as an argument from silence, NOT as a repudiation); and exactly
    # one trial in the literature (Hostler 2001, n=19, untrained, upper-body
    # pressing) has ever manipulated increment magnitude. Four items authored,
    # deliberately split so that adjacent evidence cannot be spoken as increment
    # evidence:
    #   027 load-increment-size-evidence-gap  -- the documented absence, the
    #       provenance trace, and the arithmetic/practitioner material that
    #       survives it. contested: yes.
    #   028 progression-modality-load-vs-reps -- load-vs-rep progression
    #       equivalence and its three bounds (tested envelope, hypertrophy-only,
    #       threshold-then-plateau dose-response). contested: no.
    #   029 increment-verification-floor      -- the derived MDC95 8-12% floor,
    #       shown with its derivation, plus the category distinction
    #       (undetectable is not inert) with the linear-extrapolation rescue
    #       stripped. contested: yes.
    #   030 autoregulation-vs-percentage-prescription -- the standard escape from
    #       the increment question, which fails twice. contested: yes.
    #
    # ROUTING. All four to the EXERCISE domain. Three sit in @performance-lit
    # (VC-C): position-stand prescription, sports-science meta-analysis and a
    # network meta-analysis with internal contradictions are exactly the material
    # the lane's two methodology rules -- exercise/replication-power-crisis-005
    # and exercise/small-n-culture-006 -- exist to grade through. Item 029 is the
    # NON-OBVIOUS one and goes to @clinical-physio (VC-A) instead, even though
    # its sources are sports-science journals: its subject is clinimetric
    # (test-retest reliability, standard error of measurement, minimal detectable
    # change), and measurement-instrument limits belong to the clinical
    # verification culture. Direct in-warehouse precedent:
    # sleep-recovery/tracker-accuracy-003, an instrument-accuracy item that sits
    # in that domain's @clinical lane rather than among its substantive claims.
    #
    # REJECTED during verification, recorded here rather than quietly dropped
    # (same discipline as the v7 rejected-claim ledger; also mirrored into
    # GAPS.md cross-cutting):
    #   - "A JSCR study showed smaller weight increments produce more consistent
    #     strength gains" (reposted by Speediance and other content farms, no
    #     author/year/DOI). REJECTED -- but note the nuance, because it changes
    #     the correct response: two research passes declared this a pure phantom,
    #     and the third, adversarial pass then found that a real, on-point JSCR
    #     paper DOES exist -- Hostler 2001 -- and that it points the OTHER WAY
    #     (micro-loading merely not-worse, with the authors noting traditional
    #     loading might be more effective over an extended period). So the
    #     rejection is "a real study exists and the reposted claim misrepresents
    #     its direction", NOT "no such study exists". Carried on item 027.
    #   - "Microplates beat stalling." REJECTED as evidence-backed; no trial
    #     compares micro-loading against stall-and-reset. The arithmetic shows
    #     only that large increments become unsustainable, which is not evidence
    #     that small ones work. Practitioner-floor at most, never "research
    #     shows". Item 027.
    #   - "Upper body adapts slower and therefore needs smaller jumps."
    #     PHYSIOLOGY REJECTED, ARITHMETIC KEPT. Its usual support (Jung 2023,
    #     PLOS ONE 18(4):e0284216) has label-swap typos in the published abstract
    #     (correct reading: 7.2%/wk LOWER, 5.2%/wk UPPER), a primary pooled
    #     effect of 0.47 [-0.13, 1.08] that is NOT significant and only becomes
    #     so after post-hoc outlier removal, no upper/lower difference at all in
    #     beginners, and a young-women-only population. 7.2%/wk must never be
    #     stored as a sustainable rate. What survives needs no physiology: a
    #     fixed absolute step is a larger relative jump on a light lift (2.5 kg =
    #     4.17% of 60 kg vs 1.8% of 140 kg). Item 027.
    #   - "Deload restores progression." REJECTED as stated. Coleman et al. 2024
    #     (PeerJ, PMC10809978, RCT n=39 trained): a one-week COMPLETE-CESSATION
    #     deload at the midpoint of a 9-week program IMPAIRED lower-body strength
    #     gains and did nothing for hypertrophy. It tested cessation, not a load
    #     reduction, so a volume/load deload remains untested. Noted on item 027
    #     under the untested failed-increment/reset protocols.
    #   - "Load progression above 15%/week raises injury risk 21-49%." DROPPED
    #     OUTRIGHT, not downgraded, and flagged MUST-NOT-SHIP-AS-A-SAFETY-RAIL.
    #     Traces to the acute:chronic workload ratio literature, whose central
    #     injury sweet-spot figure carries a retraction request (Impellizzeri et
    #     al.), is statistically unstable at low chronic load, has no causal
    #     estimation, and describes weekly AGGREGATE team-sport load rather than
    #     per-session barbell increments. The accompanying absence is itself
    #     recorded: NO evidence links per-session increment SIZE to injury
    #     incidence in either direction. Item 027.
    #   - NSCA increment table (less-trained upper 2.5-5 lb / lower 5-10 lb;
    #     more-trained upper 5-10+ lb / lower 10-15+ lb -- 2.5-5, not the
    #     frequently miscopied 2-5). NOT rejected: its direction (more-trained ->
    #     LARGER absolute increments) is real and opposes the popular microplate
    #     framing. But the Baechle & Earle attribution could not be verified, so
    #     it is stored at the practitioner floor with the only trail that checked
    #     out (Alvar, Sell & Deuster (Eds.), NSCA's Essentials of Tactical
    #     Strength and Conditioning, Human Kinetics, 2017) and an explicit
    #     "primary locator unverified" note. No table number was fabricated.
    #   Two claims are stored CONTESTED rather than rejected, with their counters
    #   recorded: "increment size matters" (stored as an evidence gap, not a
    #   finding, item 027) and "1% more load is 1% more stimulus"
    #   (contested-and-disfavoured, refuted by the Lasevicius threshold-then-
    #   plateau dose-response, item 029). Two published papers are flagged as
    #   defective rather than used: Huang 2025 (self-contradicting abstract,
    #   SUCRA ordering with no interval excluding zero, unverifiable N -- item
    #   030) and Washif 2024 (published SEM/MDC do not reproduce from its own ICC
    #   and SD -- item 029; its recomputed values ARE used, its printed ones are
    #   not).
    #
    # LIVE CONSEQUENCE, stated honestly. The gap entry flagged that the domain
    # agent's B7 plate policy rests on an unsourced relative-load-jump heuristic.
    # This release does NOT replace that heuristic with a graded number, because
    # no evidence supports one. What it supplies instead is: the arithmetic that
    # justifies relative framing (without the rejected physiological story), an
    # explicit statement that no increment size is evidence-backed, the removal
    # of the injury-risk rail, and a measurement floor that bounds what any
    # retest can confirm. Knowledge-only: no program or prep file was read or
    # edited by this release.
    #
    # BOOKKEEPING CHECK (the items<->changelog defect that produced v8): all four
    # new stable IDs are listed under `added` below and were diffed against
    # items/ before shipping. The v8 backfill of
    # exercise/warmup-load-rampup-progression-018 was verified as already cut on
    # 2026-08-22 and is NOT re-added here -- listing a stable ID under `added` in
    # two releases would corrupt the DGN-171 touched-set diff. Nothing further
    # was owed on 018.
    added:
      - exercise/load-increment-size-evidence-gap-027
      - exercise/progression-modality-load-vs-reps-028
      - exercise/increment-verification-floor-029
      - exercise/autoregulation-vs-percentage-prescription-030
