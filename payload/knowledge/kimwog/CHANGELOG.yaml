    #   016 timeline-backward-pass (B, @test-kitchen) -- forward/backward pass
    #       and float as definitions; negative float is a proof of
    #       infeasibility, not a warning level; shortening a duration is
    #       lowering a safety parameter in this domain, not a fourth repair.
    #   017 parallelism-resource-claim (C, @test-kitchen) -- ordering-only
    #       timelines are a provable LOWER BOUND once equipment and attention
    #       capacity are considered; barriers enumerated, no durations
    #       invented; attention flagged as the resource that fails silently.
