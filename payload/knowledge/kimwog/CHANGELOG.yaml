    # 067 what back-to-back overlap costs, in three parts. Next-day
    #     performance: a squat + leg press session to failure lost volume
    #     when repeated 24 h later, with first-set load still down at 48 h
    #     (Goulart 2021). Volume-matched sets at half the possible reps had
    #     velocity and jump back by 6 h (Morán-Navarro 2017). Long-term
    #     adaptation: no cost at equal weekly volume (6x vs 3x/week;
    #     Colquhoun 2018 squatted and benched on consecutive days, Saric
    #     2019). Injury: not measured in any lifter study (Keogh & Winwood
    #     2017 has no spacing factor). Deadlift-needs-longer and
    #     upper-faster-than-lower both fail the matched test (Belcher 2019).
    #     Upper vs lower is contested against Sousa 2024. Squat-hinge, grip
    #     and secondary-mover rules are D. The structured adjacent_overlap
    #     block is for the composer; field guide in
    #     docs/kimwog-adjacent-overlap-fields.md. No program code changed.
    # 025 re-audit: the Eur J Appl Physiol 2017 paper is Morán-Navarro et
    #     al., not Pareja-Blanco; the reasoning's 24 h-pre / 48 h-post
    #     description is Pareja-Blanco JSCR 2020 (epub 2018). Attributions
