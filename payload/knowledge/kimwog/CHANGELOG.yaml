# Per-release changelog (DGN-118 F2). ONE per warehouse.
#
# The touched-set consumer (DGN-171) diffs a release's added/changed/retracted
# ID lists against the user's local touched-set and re-queries ONLY overlapping
# stable IDs. So every entry that changes an item's meaning lists the stable ID.
#
# Event classes per release:
#   added            : list of new stable IDs.
#   changed          : list of stable IDs whose content changed.
#   retracted        : list of stable IDs pulled (render as "retracted").
#   grade_transitions: {id, from, to} -- confidence-ladder moves.
#   domain_transitions: {event: merge|deprecate|alias-add|rename, ...} -- registry events.
#   lane_transitions : {id, from, to, note} -- lane: field rewrites (v3 section 4;
#                      an ID event these are NOT -- rubric-structure change only).
#
# Newest release first.

