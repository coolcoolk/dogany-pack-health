    # STUDY-CRAFT LANE OPENING (marker: studycraft-lane-opening-014-021). Opens a
    # SECOND lane on learning-habits: @study-craft (VC-E), the execution layer.
    # No new domain and no registry change -- learning-habits is already
    # registered and keeps its prefix, its aliases and all 13 existing items
    # untouched.
    #
    # WHY. Before this release, exercise was the only domain in the warehouse
    # with a craft lane alongside its evidence lanes (@gym-craft, VC-E), and
    # cooking the only other multi-lane domain. Every remaining domain had
    # exactly one lane and that lane was the evidence lane. learning-habits held
    # 13 items -- spacing, retrieval practice, the high/low-utility technique
    # rankings, the replication and measurement caveats -- and not one of them
    # tells a person how to RUN a practice: what schedule to keep, what to do
    # after a lapse, what a failed rep looks like, when a session ends. The
    # owner's self-development area is language study and writing, which is
    # repeated practice with the same structure as training, and the training
    # lane had answers this lane did not.
    #
    # VC-E IS A DIFFERENT STANDARD, NOT A LOWER ONE, and this domain is the
    # hardest place to hold that line: study advice is an ocean of confident
    # unsourced assertion. Every shipped item names its basis, states what is
    # measured and what is inference, and carries an explicit honest-limit
    # paragraph. Where a source was read at a mirror rather than the publisher,
    # the read-at-source URL is listed alongside the DOI. One automated summary
    # of a primary (Cepeda et al. 2008) came back describing it as a
    # meta-analysis when it is a 1354-subject experiment; every figure in this
    # release was therefore taken from a direct read of the source document, not
    # from a summary.
    #
    # THE REFUSALS ARE THE LARGER HALF OF THIS RELEASE. Eight items shipped;
    # nine widely repeated claims were researched and shipped in NO form, or
    # only in corrected form. The full ledger is in GAPS.md under
    # "Rejected-claim ledger, v23" and includes: the Boice "nine times
    # as many pages" statistic (not in the paper it is attributed to), the
    # 25-minute and 90-minute session lengths (no derivation; the second could
    # not be traced to any primary at all), streak/chain devices (nothing
    # located in a learning context, and pointed against the measured cost of a
    # lapse), a specific scheduler-improvement percentage (vendor data plus a
    # self-published benchmark by the algorithm's own authors), and the fixed
    # "10-20% of the retention interval" spacing rule (a misstatement of the
    # very paper it cites; shipped corrected as item 014).
    #
    # WHERE CRAFT AND EVIDENCE DISAGREE -- named, not quietly resolved:
    #   * Item 016 vs item 011. The evidence lane rates rereading and
    #     highlighting LOW utility because they manufacture fluency without
    #     durable learning. The dominant craft grading habit -- work it until it
    #     feels smooth, mark it merely "hard" when recall was slow -- reaches for
    #     that same discredited signal. Item 016 says so outright and refuses
    #     felt-smoothness as a session signal.
    #   * Item 019 vs item 013. Language craft routinely promises that a spaced
    #     vocabulary system produces fluency. The evidence lane's surface-vs-deep
    #     skew (d=0.60 vs d=0.26) says the base is the surface layer. The craft
    #     over-claim is CONTRADICTED by this warehouse's own evidence, not merely
    #     unsupported, and item 019 ships the boundary as its main product.
    #   * Item 020 vs items 005/006. "Write every day" is sold to professionals,
    #     the population where deliberate practice explains about 1% of variance
    #     (non-significant). The craft rule and the evidence lane point opposite
    #     ways and item 020 says which one has the measurement.
    #   * Item 015 vs streak folklore. Craft devices price a missed day as a
    #     catastrophe; the measured overshoot asymmetry and the savings-on-
    #     relearning effect both price it cheap. The folklore loses.
    #
    # LINT EFFECT: learning-habits becomes MULTI-LANE, so lane: is now required
    # on every item in it. All 13 pre-existing items already carried
    # lane: "@behavioral" -- verified before this payload was built -- so no
    # pre-existing item is edited by this release. changed: is empty and means it.
    #
    # NO applicability.axes ON ANY ITEM, matching the v19 home precedent. The
    # axes ledger is fitness- and health-shaped and carries no axis for study
    # horizon, target language, current load or practice history. This is a
    # content sprint and the axes ledger is append-only and framework-governed,
    # so no axis was invented. Every item is general-population and hedges in
    # prose.
    #
    # Per-item one-liners:
    #   014 interval-from-retention-target -- the schedule. Cepeda et al. 2008
    #       read at source: optimal gaps 1/11/21/21 days for 7/35/70/350-day
    #       targets, the gap:target RATIO falls (23 days = 7% of a 350-day
    #       target), and overshooting is much cheaper than undershooting.
    #   015 lapse-is-not-a-reset -- the missed-session answer the lane was opened
    #       for. Cost bounded by two measurements (overshoot asymmetry; savings
    #       on relearning still positive at 31 days); the recovery procedure is
    #       documented tooling practice, graded as such. Refuses streaks.
    #   016 rep-is-attempt-then-check -- what a failed rep looks like. Kornell,
    #       Hays & Bjork 2009 read at source (0.41 vs 0.31, d=0.58, failed
    #       attempts still beat read-only at equal time). Names the fluency
    #       contradiction with item 011.
    #   017 reformulate-do-not-grind -- the setup half. The 8-lapse leech
    #       threshold and the manual's own remedy ordering (change the card
    #       first), plus the minimum information principle. One practitioner's
    #       1999 rule set, never tested as a package.
    #   018 review-load-follows-intake -- the volume-landmark analogue. The
    #       published 20-new-items-a-day -> ~200-reviews-a-day ratio; shape is
    #       arithmetic, multiplier is a practitioner number tied to one
    #       scheduler's defaults.
    #   019 language-widen-the-interval -- Bahrick et al. 1993 read at source:
    #       13 sessions at 56 days matched 26 at 14 days, direction consistent
    #       across all 4 subjects, who were the paper's own authors. Ships the
    #       lexical-layer boundary as its main product.
    #   020 writing-volume-measurement-trap -- Sword 2016 read at source. The
    #       mantra's evidence base is 10 hand-picked mentored procrastinators and
    #       a 27-completer study whose control group was told not to write; the
    #       famous statistic is not in the paper; 7 of 8 surveyed academics do
    #       not write daily.
    #   021 session-stop-condition -- mostly refusal. No evidence supports any
    #       session length; ships the queue-empty stop condition as the only one
    #       with a derivation, and says plainly that nothing in it is measured.
    added:
