  - version: v13
    date: 2026-09-02
    # NUTRITION-LANE collection sprint. First sprint to land in the nutrition
    # domain since v2 (2026-07-06). Directly answers the standing GAPS complaint
    # that the lane was 4/5 field-METHODOLOGY items with a single substantive
    # claim, and the v7/v9 cross-cutting complaint that every sprint since v4
    # landed in exercise. NOTE: this warehouse takes concurrent writes -- other
    # releases landed the same day (gated-row resolution, finance-investing).
    # None of them touch nutrition, so there is no ID overlap; the release
    # number of THIS block is assigned at apply time, not hardcoded.
    #
    # CONSUMER FRAMING: the lane is read every day against a real logged meal
    # diary by a personal-training consumer that advises on protein targets and
    # body composition. Items were selected for what that consumer must NOT get
    # wrong, not for topic coverage.
    #
    # SOURCING DISCIPLINE. Every source was retrieved directly (EuropePMC record
    # or the issuing body's own document) rather than taken from a secondary
    # write-up, and each item names authors, journal, year and a resolvable DOI
    # or official URL. No claim shipped on "studies show".
    #
    # 10 items authored. Half carry contested: yes, which is the honest
    # proportion for this lane rather than a stylistic choice -- 4 of the 5
    # contested items are contested because the evidence is THIN or the
    # population is wrong, and 1 (008) because there is a live printed dispute
    # between named investigators.
    #
    #   007 self-report-underreporting          A/field-methodology, not contested.
    #       The single highest-value item for a log-reading consumer: the log is
    #       a biased instrument. Recovery-biomarker validation, 5 pooled US
    #       cohorts. Under-reporting is DIFFERENTIAL (predicted by BMI, age,
    #       education), so a flat correction factor is the wrong repair.
    #   008 protein-per-meal-ceiling            B, CONTESTED. Holds a live dispute
    #       against an already-shipped top-band item (nutrition/protein-intake-002
    #       owns the 0.25 g/kg per-meal figure). Trommelen 2023 quadruple-tracer
    #       trial says no upper limit; Witard & Mettler 2024 dispute the practical
    #       reading in print and state it does not extend to resistance-trained
    #       young women; Trommelen replied. Deliberately NOT resolved. The only
    #       thing that changes for a consumer is a DE-ESCALATION: stop warning
    #       users that protein above ~40 g in a sitting is wasted.
    #   009 protein-distribution-thin           C, CONTESTED. The positive result
    #       is an n=8 acute crossover; two RCTs at real outcomes returned null;
    #       both were in OLDER adults, so nobody has tested this to a hypertrophy
    #       endpoint in trained young people at all.
    #   010 energy-availability-threshold       C, CONTESTED. The 30 kcal/kg FFM
    #       cut-off, quoted from the 2023 IOC consensus statement's own walk-back
    #       ("intended as a guide, rather than a diagnostic end-point"), plus the
    #       n=29 5-day sedentary-female origin trial, plus the finding that all
    #       three inputs to the EA equation are unmeasurable in a consumer setting.
    #   011 body-composition-measurement-floor  B, not contested. Instrument-limit
    #       item, structurally echoing sleep-recovery/tracker-accuracy-003 and
    #       exercise/increment-verification-floor-029. Reliability is not accuracy:
    #       consumer bioimpedance retests to ICC 0.987-0.995 while carrying a
    #       +3.4 kg fat-free-mass offset in men (n=1000 vs DXA). DECLINES to
    #       publish a detection threshold for the uncontrolled consumer case.
    #   012 weight-loss-rate-lean-mass          C, CONTESTED. The 0.5-1 %/wk rule
    #       traced to its origin: one unblinded n=24 trial whose arms differed in
    #       DURATION (8.5 vs 5.3 wk), confounding rate with training exposure.
    #   013 fibre-doseresponse                  C, not contested. The strongest
    #       substantive diet claim available, and it still lands at the
    #       observational band -- which is the point of filing it. Explicitly
    #       records WHY the tiny-effect cap does not apply here.
    #   014 kr-reference-intakes-2025           A/jurisdictional-standard, LOCALE KR.
    #       The KR check surfaced a live staleness trap: Korea revised its national
    #       standard on 2025-12-31, so every 2020-edition Korean figure in
    #       circulation is a prior edition. Protein AMDR 7-20% -> 10-20%; fibre
    #       re-derived at 12.5 g/1000 kcal. Carries an explicit provenance
    #       asymmetry note: the adult male 30 g figure is triply cross-checked,
    #       the female under-50 figure was read from a reconstructed table layout
    #       and is flagged for re-reading rather than asserted.
    #   015 metabolizable-energy-atwater        B, not contested. Whole-diet feeding
    #       with complete excreta collection: almonds 32% over-predicted, walnuts
    #       21%, and the gap closes as the food is ground. Scope held HARD to tree
    #       nuts so it cannot become a general excuse to distrust database calories.
    #   016 kr-food-composition-accuracy        C, CONTESTED, LOCALE KR. The only
    #       chemical validation of the Korean composition tables located: energy
    #       98%, protein 101%, lipid +24%, carbohydrate -8%. Its answer is
    #       convenient, which is why the discipline was applied rather than
    #       relaxed -- n=66 women, one island, 2003.
    #
    # ROUTING. All ten to NUTRITION / @obs-inferential. Two placements were
    # non-obvious and are recorded so a later pass does not silently re-route
    # them. 011 (body-composition instrument limits) could have gone to exercise;
    # it did not, because its consumer question is "what does this reading say
    # about the diet I logged", and because the domain's existing precedent for
    # an instrument-limit item sitting beside the substantive claims it bounds is
    # sleep-recovery/tracker-accuracy-003. 012 (rate of weight loss) is a
    # nutrition-side energy-balance claim, not a training-prescription claim, and
    # its sibling protein band is already nutrition-owned by 002.
    #
    # REFUSED, and recorded here rather than quietly dropped (v7/v9 discipline).
