    # 070 floors by experience (@performance-lit): >=10 weekly sets enhances
    #     growth (ACSM 2026 umbrella review); 2-3 sets per exercise beat one
    #     by ~40% in trained and untrained (Krieger 2010); novices grow on
    #     <10 weekly sets (Schoenfeld 2017, mostly untrained); trained lifters
    #     grow at 9-24 weekly sets in short trials with no proven edge above
    #     ~12 (Heaselgrave 2019, Aube 2022, Barsuhn 2025); ~11 fractional sets
    #     per muscle per session is a point of no detectable extra benefit,
    #     not a harm limit (Remmert 2025, preprint). Barbalho 2020 "5-10 sets
    #     is enough for trained men" is RETRACTED and excluded.
    # 071 maintenance vs growth in a cut (@performance-lit): a third or a
    #     ninth of the growth dose with the load kept held muscle in young
