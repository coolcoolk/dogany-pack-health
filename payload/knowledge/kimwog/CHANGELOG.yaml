    #     n=39 full week off; Pancar 2026 untrained n=19 reduced-volume weeks;
    #     Ogasawara 2013 untrained n=14 3-week breaks) show no hypertrophy
    #     cost; none shows a gain; a full week off leaned toward less strength
    #     and left trainees more sore and less motivated. Recipe from practice
    #     (Rogerson 2024, n=246: every 5.6 weeks, 6.4 days, fewer sets, further
    #     from failure, frequency kept) and a coaches' Delphi (Bell 2023).
