    # ---- dispatch kw-nu-diet-adherence-structure ----
    # Primaries read 2026-10-07 at the abstract (Europe PMC) and, for
    # MATADOR, the full text (PMC5803575).
    # 025 flexible vs rigid restraint (C): the correlates (rigid with
    #     disinhibition, binge episodes, ED symptoms) replicate; the one RCT
    #     (Conlin 2021, n=23) found equal loss. The causal sentence "flexible
    #     dieting makes you lose more" is refused. Linardon 2017 counterweight
    #     carried (flexible control with more body-image concern).
    # 026 diet breaks and refeeds (B, contested): no fat-loss cost per week
    #     of restriction across MATADOR, ICECAP and Campbell 2020; ICECAP
    #     (ITT, trained adults) found less hunger and no extra fat loss.
    #     MATADOR's 14.1 vs 9.1 kg is obese men, provided food, per protocol,
    #     30 weeks for 16 of restriction -- held contested, not quoted as an
    #     expectation. Refeed fat-free-mass claim held D (reanalysed in print).
    # 027 self-monitoring frequency (C): consistent association, causality
    #     unestablished, no dose; log-ins not minutes (Harvey 2019); daily
    #     weighing as a bundle RCT (Steinberg 2013); harm signal in some women
    #     and younger people (Pacanowski 2015) -> an exit rule.
    # 073 weekend drift (C): +82 kcal per weekend day (US), weight loss stops
    #     at weekends (Racette 2008), 0.35 pct within-week weight swing
    #     (Turicchi 2020, n=1,421). Eating gap = lever; Monday bump = noise.
    # 074 the engine-readable synthesis (D): 11 adherence_rules for the diet
    #     card and weekly retro, each with basis and basis_grade; thresholds
    #     labelled product constants. Field guide:
    #     docs/kimwog-adherence-rules-fields.md.
    #
    # ---- dispatch kw-nu-kr-convenience-protein ----
    # 030 kr_protein_options: 41 rows (17 convenience, 24 eating-out) read
    #     from MFDS K-FIND on 2026-10-07 -- protein g per 100 kcal (rank
    #     key, same density term the diet engine uses), sodium mg per 100
    #     kcal and per g protein, tier fields, per-serving figures only where
    #     K-FIND gives a serving, allergen and dietary tags. Category rows
    #     are medians + IQR over manufacturer label entries; dish rows are
    #     single analysed restaurant servings (2012-2022); K-FIND's
    #     calculated 외식 rows are excluded (sodium contradicts the analysed
    #     rows). Lean tier (>=15 g/100 kcal): ready-to-eat chicken breast
    #     20.0, milk-protein RTD drinks 18.2, 선지해장국 15.9, 설렁탕 17.8
    #     (home analysis, unsalted; restaurant bowl on 022). The
    #     protein-dense 해장국 rows carry the highest sodium per 100 kcal in
    #     the table. Tier cut-offs are product constants. suggest.py's
    #     logged-foods-only contract is left to a product decision.
    #
    # ---- dispatch kw-nu-alcohol-training-cut ----
    # Filed in nutrition (@obs-inferential) because the questions are diet
    # and training ones; the health-outcome alcohol rows stay in leisure
    # (009-011) and are linked. Partly closes leisure OPEN WANTS 1-3.
    # 031 dose bands in g/kg (Pietila 2018 edges 0.25 / 0.75; trial anchors
    #     0.5 / 1.0 / 1.5). Sleep: REM -11.3 min, significant from ~0.5 g/kg,
    #     faster onset only >=0.85 g/kg, total sleep not determinable
    #     (Gardiner 2025, 27 studies). Muscle: MPS -24% with whey / -37%
    #     without at 1.5 g/kg (Parr 2014, n=8); strength loss larger at
    #     1 g/kg, null at 0.5 g/kg (Barnes 2010/2011, n=10 each). Fat loss:
    #     7 kcal/g; lipid oxidation -73% after 24 g, DNL <5% (Siler 1999);
    #     no compensation, +343 kJ food (Kwok 2019). BEER-HIIT: weekday beer
    #     did not blunt 10-week training gains (self-selected exposure, C).
    #     Structured alcohol_rules (9 rules: say / avoid / basis_grade) for
    #     retro and diet copy, including no-moralizing (D, product rule).
    # 032 KR units: ethanol_g = mL x ABV x 0.789 (soju bottle ~47 g, glass
    #     ~6.5 g, 355 mL beer ~12.6 g); KDCA 2025 Community Health Survey:
    #     monthly drinking 57.1%, monthly binge 33.7%, high-risk 12.0%;
    #     Korean guideline (JKMA 2024): <=8 x 14 g/week men to 65, 4 women
    #     and older men, binge >3 / >2, flushers half (D). Structured
    #     drink_units + kr_thresholds; survey labels never applied to a user.
    #     Field guide: docs/kimwog-alcohol-rules-fields.md.
    #
    # ---- dispatch kw-sl-sleep-regularity-weight ----
    # Every primary was read at its PubMed record (abstract); no full texts.
    # 014 regularity vs duration: timing consistency is associated with
    #     outcomes independently of hours (Windred 2024 UK Biobank n=60,977,
    #     SRI out-predicts duration for mortality; Huang 2020 MESA, duration
    #     SD >120 min / onset SD >90 min ~2x CVD). No threshold exists
    #     (Chaput 2020 review). NSF 2023 consensus graded for what it says
    #     only. Weekend catch-up contested (consensus/review favourable vs
    #     Depner 2019 controlled harm). No training-adaptation claim.
    # 015 short sleep, appetite, weight: intake +385 kcal/d with no EE change
    #     (Al Khatib 2017 meta); extension -270 kcal/d in habitually short
    #     sleepers (Tasali 2022 RCT, DLW). In a deficit, short sleep shifts
    #     loss toward fat-free mass (Nedeltcheva 2010 n=10; Wang 2018 n=36).
    #     Contested by Depner 2021 (no between-group energy-balance diff).
    # 016 engine-readable sleep_rules for briefs (D synthesis), trimmed to
    #     seven rules at the merge (see DEDUPED): needs / when /
    #     threshold_min / threshold_kind / brief_action / never_say / basis /
    #     basis_grade. 360 min is a source threshold, 420 a consensus floor,
    #     the rest product constants. Three timing rules need onset/wake
    #     times that hk-ingest does not store yet (as does v37 072's
    #     early-alarm-pattern). Early-start schedules from Sargent 2014 (two
    #     athlete actigraphy cohorts). Field guide:
    #     docs/kimwog-sleep-rules-fields.md.
    # changed: 004, 005, 013 -- one within-warehouse source line each linking
    #     the new items; no claim, grade or note text touched. 072 (sleep):
    #     one source line linking 016.
    #
    # ---- dispatch kw-sh-product-choice-overload ----
    # Five spending-saving items, @household-behavioral lane, no registry or
    # lane change (no shopping domain exists; kept in spending-saving).
    # 028 choice overload is conditional: Scheibehenne 2010 mean effect ~0
    #     (50 experiments, N=5,036); Chernev 2015 four moderators (set
    #     complexity, task difficulty, preference uncertainty, effort goal;
    #     99 obs, N=7,202). Jam study numbers read in full (30% vs 3%) and
    #     kept as origin, not effect size. contested: yes.
    # 029 small diverse aligned set: diversification at constant quality
    #     lowers choice difficulty (Willemsen 2016); alignability (Gourville
    #     and Soman 2005). 3-4 is a product constant.
    # 030 picks are relative: clicks reliable as relative, not absolute,
    #     preferences; trust (position) bias (Joachims 2005); no negative
    #     signal from non-action (Hu, Koren, Volinsky 2008).
    # 031 stars are a weak quality signal: no convergence with Consumer
    #     Reports (de Langhe 2016), J-shape self-selection (Hu 2009), ~16%
    #     Yelp-filtered (Luca and Zervas 2016), popularity bias (Powell 2017);
    #     KR KFTC sponsored-review disclosure (2020-09-01).
    # 074 find_rules (D synthesis): 16 structured rules in four groups (set,
    #     moderators, picks, ratings) plus the per-use rule from 010.
    #
    # ---- dispatch kw-sc-reminder-lead-time ----
    # Two task-management items that EXTEND the v37 schedule/task-time sprint
    # (items 070-073) without duplicating it: 072 holds remind-at-all,
    # two-stage, last cue at the actionable moment and
    # lead-minutes-are-a-setting; 073 holds buffers.
    # 074 alert fatigue / notification budget (C): Ancker et al. 2017 (full
    #     text; 112 clinicians, 1.27M reminders) -- each extra reminder per
    #     encounter IRR 0.70 for acceptance, each 5-point rise in repeats IRR
    #     0.90, no workload effect, no wear-out of new reminders; Stothart 2015
    #     unanswered notifications still cost attention; Fitz 2019 RCT n=237
    #     three-a-day batching beat as-usual, none-at-all raised anxiety
    #     (self-report); Pielot & Rello 2017 same split. Structured
    #     alert_rules; every cap and digest time is a product setting.
    # 075 travel / prep departure cue (C): departure from a high percentile
    #     of travel time, not the mean (FHWA 2005; Fosgerau & Karlstrom 2010);
    #     stated travel times not reliably short (Tenenboim & Shiftan 2018,
    #     over-estimates 2.5x under-estimates) vs compressed remembered
    #     navigation time (Brunec 2017) -> no correction factor, use routed or
    #     logged times; prep from logged actuals (Roy & Christenfeld 2008;
    #     001; 070); time-based intentions need an external cue (field
    #     position via Kvavilashvili et al. 2009 intro). Structured
    #     reminder_rules extending 072's. 90th-percentile default is a
    #     setting.
    # 072 (task-management) changed: two source lines linking 074 / 075.
