    # the evidence lane. The craft lane is what makes a domain usable rather than
    # merely correct -- @gym-craft carries how to size a warm-up jump and how to
    # cue a muscle, none of which is in a paper. nutrition had 15 evidence items
    # and zero craft items while the consumer logs the owner's meals every day.
    #
    # SCOPE. Aimed at the practice of LOGGING AND ADJUSTING, not at nutrition
    # science: the shape of a re-ask (017), what a portion estimate is worth
    # (018), what to do with a day that has no record (019), how to log Korean
    # composite and shared dishes (020), and how a protein target converts into
    # countable units on a Korean plate (021).
    #
    # VC-E IS A DIFFERENT STANDARD, NOT A LOWER ONE. Every item names its basis
    # and marks the untested part as untested. Item 017 ships a federal survey
    # instrument's five-pass structure and states that its transfer to a
    # chat-based self-log has never been tested. Item 018 is a controlled test of
    # a technique and ships contested because it is one unreplicated study. Items
    # 020 and 021 quote two published Korean professional tools exactly and label
    # the rules built on top of them as conventions rather than findings. Nothing
    # shipped rests on "it is generally recommended".
