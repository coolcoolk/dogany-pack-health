    #     Curr Biol) is n=36 with METABOLIC endpoints, not performance. Refused.
    #   - magnesium -- not researched at all this sprint. Still open.
    #   - proprietary readiness/recovery scores -- searched, no peer-reviewed
    #     validation against measured next-day performance located. Recorded as
    #     a searched-and-unfound gap on item 011, NOT as a negative finding.
    #   - sleep and hypertrophy/testosterone -- the candidate primaries
    #     (Leproult 2011 n=10; Saner 2020 n=24) are mechanistic. Shipping them
    #     would have meant laundering mechanism into outcome. Refused.
    #   - caffeine timing versus sleep -- not researched. Still open.
    #
    # ROUTING NOTE (unchanged, still correct): recovery-from-TRAINING physiology
    # stays in the exercise domain (items 021-026). This sprint filled the SLEEP
    # half of the domain's name, which was the genuinely missing part.
    #
    # Per-item one-liners:
    #   004 sleep-loss-performance-decrement (B/D) -- Craven 2022, 69 pubs / 227
    #       outcomes; negative in EVERY category including strength; pooled
    #       -7.56% graded down for I2 98.1%; the durable findings are the
    #       pattern split and the AM/PM asymmetry (~0.4%/h awake).
    #   005 sleep-extension-weak-evidence (C/D, contested) -- Silva 2021: 74
    #       screened, 7 included, all 3 RCTs high risk of bias, 2 nulls, no
    #       pooling possible. Mah 2011 (n=11, no control arm) named as origin.
    #   006 adult-injury-risk-not-established (C/D, contested) -- the "1.7x"
    #       figure is ADOLESCENT and retrospective (Milewski 2014, CI 1.0-3.0);
    #       Dobrosielski 2021 (12 prospective adult cohorts) finds the evidence
    #       does not support poor sleep as an independent adult risk factor.
    #   007 cbti-strong-sleep-hygiene-weak (A) -- Edinger 2021 AASM guideline:
    #       STRONG for multicomponent CBT-I, CONDITIONAL AGAINST sleep hygiene
    #       as a single-component therapy. First substantive item to use the
    #       aasm-hierarchy-001 / grade-aasm-anchor-002 anchors as intended.
    #   008 melatonin-chronobiotic-not-hypnotic (B/C, contested) -- closes the
    #       melatonin half of the v3 5a supplement-routing gap. Endorsed for
    #       circadian disorders, recommended against for chronic insomnia,
    #       pooled effect about 7 minutes.
    #   009 nap-force-null-shuttle-signal (C/B/D, contested) -- closes the
    #       nap-protocol gap. Pooled SMD 0.99 resolves into one shuttle-run
    #       signal and a NULL on muscle force (0.175, p=0.267).
    #   010 evening-training-sleep-effect (B/C/D) -- Stutz 2019, 23 PSG studies:
    #       evening exercise does not harm sleep. Carries the source's own
