    # ---- dispatch kw-ex-pull-plane-balance ----
    # PULL-PLANE BALANCE (dispatch kw-ex-pull-plane-balance). One exercise
    # item, no new lane, no registry change. Primaries read at PubMed abstracts on 2026-10-06.
    #
    # 066 no sourced pull:push program ratio exists; 2:1 and 3:1 refused (no
    #     primary found). Trained athletes press about what they pull
    #     (Baker 2004: bench 97.7% of weighted pull-up) -> pulls >= pushes as
    #     a product floor (D). Lifters carry cuff / lower-trap imbalances
    #     (Kolber 2009, 2017, cross-sectional, C); external-rotation and
    #     scapular strength protect throwers (Clarsen 2014 cohort, Andersson
    #     2017 cluster RCT; by analogy, C). Thoracic posture not linked to
    #     shoulder pain (Barrett 2016) -> no posture-correction copy.
