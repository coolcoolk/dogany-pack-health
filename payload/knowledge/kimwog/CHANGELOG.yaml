    # SKINCARE-HYGIENE DOMAIN OPENING (marker: skincare-lane-opening-001-015).
    # The owner directed the warehouse be filled along HIS taxonomy. Area 16
    # under 건강 -- 스킨케어/위생 -- held ZERO items while its siblings 신체건강
    # (exercise), 식습관 (nutrition), 정신건강 (mental-health) and sleep-recovery
    # were covered. This release opens it: a new registry row, two new lanes in
    # lanes.yaml, and 15 items.
    #
    # NOTE ON CONCURRENCY: this warehouse takes heavy concurrent writes -- v11
    # through v16 landed on 2026-09-02 and further passes were live while this
    # one was built. The release number of THIS block, every size count in the
    # GAPS.md bullet it ships with, and the registry/lanes appends are all
    # computed or performed at apply time against the file as it is then on
    # disk. Nothing here is hardcoded, and rollback refuses on drift.
    #
    # TWO LANES, TWO CULTURES, DELIBERATELY NOT BLENDED:
    #   @clinical-derm (VC-A) -- what happens to a person. RCTs, Cochrane and
    #     other named-methodology systematic reviews, GRADE certainty, blinded
    #     assessment. 11 items. Also carries hygiene-practice trials, which are
    #     adjudicated by the same culture.
    #   @cosmetic-regulatory (VC-F, the @food-safety anchor) -- what a regulator
    #     has ruled. The national instrument itself, quoted with its number and
    #     effective date. 4 items.
    # The split exists because the characteristic error of this subject matter is
    # reading a regulatory permission as an efficacy finding. A VC-F item is
    # definitive about what a rule SAYS and silent about whether the regulated
    # thing WORKS.
    #
    # SOURCING DISCIPLINE. Every clinical source is a named primary publication
    # with authors, journal, volume, pages, year and a resolvable DOI, retrieved
    # through the PubMed E-utilities record rather than from any secondary
    # write-up. Every Korean regulatory source was retrieved DIRECTLY from the
    # 국가법령정보센터 open interface at law.go.kr as XML (the statute and the
    # ministry notices) or as the ministry's own PDF annex, and quoted verbatim.
    # No brand page, no beauty-media article and no content-farm repost is cited
