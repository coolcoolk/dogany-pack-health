    # COOKING-LANE collection sprint (marker: cooking-lane-expansion-005-013).
    # First sprint to land substantive research in the cooking domain. Before
    # this, cooking held three items, ALL of them field-methodology rather than
    # cookable content: how craft testing is graded (001), how contested toxicity
    # scares are defaulted (004), and one real safety claim (002, poultry
    # temperature). The domain goes 3 -> 12. NOTE: this warehouse takes
    # concurrent writes -- four releases landed on 2026-09-02 while agents
    # worked. The release number of THIS block, and every size count in the
    # GAPS.md bullet it ships with, are computed at apply time from disk, never
    # hardcoded.
    #
    # CONSUMER FRAMING. The lane is being prepared for a live cooking-session
    # module -- a start-it-and-it-tells-you-what-to-do flow, modelled on the
    # owner's workout-session agent. So items were selected for what a session
    # must not get wrong WHILE COOKING: a safe temperature, a discard decision, a
    # storage duration, a technique lever. Encyclopaedic coverage was not a goal
    # and was not attempted.
    #
    # JURISDICTION DISCIPLINE, the governing rule of this sprint. Earlier the
    # same day a claim was dropped from this lane after a Korean check: the US
    # codifies a lower-temperature-plus-holding-time safety equivalence for whole
    # cuts, and Korea codifies nothing of the kind. A US regulatory fact is not a
    # Korean regulatory fact. Five of the nine items are therefore KR-locale and
    # sourced to the Korean regulator itself (Ministry of Food and Drug Safety,
    # via foodsafetykorea.go.kr and the government policy portal korea.kr) rather
    # than to a US chart. Item 005 fences the exact edge that was dropped: it
    # publishes the Korean beef range 63~77C verbatim AND records that Korea
    # attaches no holding-time equivalence to its lower end.
    #
    # SOURCING DISCIPLINE. Every source was retrieved directly. The two
    # microbiology items rest on named peer-reviewed papers with DOIs (Foods
    # 2023;12(3):626; Lett Appl Microbiol 2008;46(5):536-541; Foods
    # 2023;12(17):3245). The Maillard item rests on Foods 2025;14(11):1881. The
    # alcohol figures were extracted from the USDA primary PDF itself (retention
    # codes 5001-5010, ethyl alcohol column), not copied from a write-up. No
    # recipe blog, cooking show or content-farm repost is cited anywhere in this
    # release.
    #
    # FOLKLORE CORRECTED RATHER THAN SHIPPED (three of the nine items exist to
    # replace a false popular version):
    #   011 "salting pasta water changes the boil" -- wrong about magnitude AND
    #       direction. 0.18 C at conventional salinity; salt RAISES the boiling
    #       point, so it cannot make water boil faster.
    #   012 "the alcohol cooks off" -- false at every ordinary duration.
    #       Flambeing retains ~75%, worse than a 15-minute simmer at ~40%.
    #   013 "browning starts at 140C" -- no such threshold exists in the kinetic
    #       literature; the dependence is continuous with model optima near 120C.
    #
    # WHAT WAS RESEARCHED AND REFUSED (recorded so the absences are not read as
    # all-clears; full detail in the GAPS.md cooking section and the
    # rejected-claim ledger):
    #   - "rest meat and it keeps its juices" -- every measurement located is
    #     blog-tier, and the one controlled attempt that held serving temperature
    #     constant reported no difference. REFUSED.
    #   - marinade penetration depth in millimetres -- the circulating figures
    #     are blog-sourced; the peer-reviewed literature located is about
    #     phosphate-tumbled poultry and ultrasound-assisted processing, not a
    #     household marinade. REFUSED.
    #   - "never wash raw chicken" -- real public-health advice, but traceable in
    #     this pass only to regulator communications, not to a retrievable
    #     primary measurement. REFUSED; item 009 ships the cutting-board evidence
    #     that DOES have a primary behind it.
    #   - cooking time as a function of thickness (Fourier scaling) -- correct
    #     physics, but the peer-reviewed food-engineering sources were paywalled
    #     or scanned-image-only in this pass. REFUSED pending a readable primary.
    #   - Korean fermentation safety (kimchi, jang) and banchan storage limits --
    #     high value for this consumer, not researched in this pass. Recorded as
    #     an open gap, not as an all-clear.
    #
    # STRUCTURAL FINDING recorded in GAPS.md: none of the nine items carries
    # applicability.axes, because the axes ledger is fitness-shaped (training
    # status, one-rep max, body composition) and nothing in it conditions a
    # cooking-safety claim. A cooking pack would need its own pack-namespaced
