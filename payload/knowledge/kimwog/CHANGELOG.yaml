  - version: v19
    date: 2026-09-02
    # HOME-DOMAIN OPENING SPRINT (marker: home-lane-opening-001-013). Opens the
    # `home` domain -- the owner's own taxonomy unit for the household area,
    # filled at his explicit direction along HIS shape rather than the
    # warehouse's, because the modules will be designed from that view. He
    # stated that reorganising later is fine; lanes are not part of a stable ID,
    # so re-laning later costs a lane_transitions entry and nothing else.
    #
    # STRUCTURE. New registry row `home` (new prefix, no aliases). Two new lanes
    # appended to lanes.yaml mapping the owner's two areas:
    #   @home-environment (VC-B) = the dwelling as an exposure  -> items 001-007
    #   @household-labor  (VC-F) = the labour of maintaining it -> items 008-013
    # The deprecated `daily-life-ops` fixture overlaps this subject matter and
    # was deliberately NOT aliased into `home`: aliasing a tombstone forward
    # would make a slug that must render retracted resolve to an active domain.
    #
    # SOURCING DISCIPLINE. Every source is a resolvable primary publication with
    # DOI, or a regulator/standards-body document read at that body's own site.
    # No lifestyle media was used anywhere. No manufacturer was used as a source
    # for its own product's efficacy, at any point, including on the air-cleaner
    # item where that is the entire commercial literature. Korean claims were
    # checked at Korean sources (National Law Information Center, Ministry of
    # Government Legislation, Statistics Korea), not inferred from US/EU
    # analogues; where the Korean case could not be verified at source it was
    # left out and recorded in GAPS.md rather than estimated.
    #
    # THIS DOMAIN IS MOSTLY FOLKLORE, AND THE SHIPMENT REFLECTS THAT. 13 items
    # from a much larger candidate set. Four of the thirteen exist primarily to
    # REFUSE a widely believed claim (002, 007, 010, 011), one ships only the
    # corrected version of a claim the popular form of which is wrong (005), and
    # one carries a named zombie stat as a refraction note (009). Nine further
    # claims were researched and shipped in NO form at all -- see the
    # v19 rejected-claim ledger in GAPS.md, the honest half of this
    # release.
    #
    # NO applicability.axes ON ANY ITEM. The axes ledger is fitness- and
    # health-shaped and carries no housing or dwelling axis. This sprint declined
    # to invent one: the ledger is append-only and framework-governed, and a
    # content sprint is not the place to extend it. Every item is therefore
    # general-population and hedges by refraction note rather than by axis.
    #
    # DELIBERATE NON-OVERLAP WITH cooking. Food handling, cutting boards,
    # refrigerator temperature and cross-contamination-to-food are food-safety
    # questions owned by the cooking domain's @food-safety lane, which is being
    # expanded concurrently. This sprint stayed off them entirely; item 011
    # (kitchen sponges) is filed under household labour because the claim is
    # about a cleaning ritual, and it carries an explicit note deferring the
    # food-contact questions to cooking.
    #
    # Per-item one-liners:
    #   001 dampness-mould-respiratory (B) -- WHO 2009 "sufficient evidence" plus
    #       Fisk 2007 pooled ORs 1.34-1.75, ~30-50% increases. The one strongly
    #       evidenced thing in the whole domain.
    #   002 mould-no-exposure-threshold (A rule) -- a REFUSAL shipped as an item,
    #       on WHO's own words: no quantitative health-based guideline values or
    #       thresholds can be recommended. Kills spore-count home grading.
    #   003 kr-radon-recommended-standard (A, KR) -- WHO 100 Bq/m3 reference vs
    #       Korea's 148 recommended standard for new apartments, plus the
    #       builder's legal duty to measure and publicly post for 60 days.
    #       Records that compliance is not safety.
    #   004 kr-mandated-ventilation-rate (A, KR) -- 30-unit threshold and 0.5 air
    #       changes/hour from the current rule text; catches the stale 100-unit
    #       figure still circulating in Korean secondary summaries.
    #   005 co2-ventilation-proxy-not-agent (C/D, contested) -- pure CO2 at
    #       3000 ppm did nothing; bioeffluents at the same CO2 did. CO2 ships as
    #       a ventilation proxy, not as the agent.
    #   006 air-cleaner-source-control-first (C/D, contested) -- 2024 review
    #       ranks policy and source control above engineering controls; no
    #       pooled effect size exists and none is quoted.
    #   007 otc-foggers-bed-bugs (B) -- 3 consumer foggers, 5 bed bug
    #       populations, little if any effect. Scope held strictly to bed bugs.
    #   008 bleach-mixing-chloramine (A/B, HARD SAFETY) -- Reisz 1986 three cases
    #       of life-threatening toxic pneumonitis; stated as the absolute rule
    #       (never combine bleach with anything) because label-reading fails at
    #       the moment of use.
    #   009 cleaning-agents-lung-function (C, contested) -- Svanes 2018, 6235
    #       participants over 20 years, -22.1 vs -18.5 ml/yr FEV1 in women, null
    #       in men. Carries the "20 cigarettes a day" zombie stat as REFUSED.
    #   010 antibacterial-wash-not-grase (A, US) -- FDA 2016 final rule, 19
    #       ingredients not GRASE; locale set to US because no KR determination
    #       was verified, per the poultry-item precedent.
    #   011 sponge-sanitation-folklore (C/D, contested) -- refuses BOTH the
    #       microwave-sanitises folk claim and the sanitising-makes-it-worse
    #       viral correction. The controlled follow-up's own authors decline to
    #       sign a direction.
    #   012 diy-disinfectant-efficacy (C) -- vinegar and baking soda under
    #       3 log10 where commercial disinfectants fully inactivated. Cleaning
    #       vs disinfecting separated explicitly; 2000 source, staleness
    #       declared.
    #   013 kr-household-labour-time (B, KR) -- Statistics Korea 2024 time diary:
    #       1h24m husband vs 3h32m wife in dual-income households, gap down 30
    #       minutes in five years, roughly half of that from the wife's hours
    #       falling rather than the husband's rising.
    added:
