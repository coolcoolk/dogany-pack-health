    # NUTRITION CRAFT-LANE OPENING (marker: mealcraft-lane-opening-017-021).
    # Adds a SECOND lane to the nutrition domain: @meal-craft (VC-E,
    # practitioner craft). No registry change -- nutrition is already active.
    # One lanes.yaml row, five items, one GAPS section. Content only.
    #
    # THE GAP THIS CLOSES. Before this release only exercise had three lanes and
    # only cooking had two; every other domain in the warehouse had exactly one,
    # the evidence lane. The craft lane is what makes a domain usable rather than
    # merely correct -- @gym-craft carries how to size a warm-up jump and how to
    # cue a muscle, none of which is in a paper. nutrition had 15 evidence items
    # and zero craft items while the consumer logs the owner's meals every day.
    #
    # SCOPE. Aimed at the practice of LOGGING AND ADJUSTING, not at nutrition
    # science: the shape of a re-ask (017), what a portion estimate is worth
    # (018), what to do with a day that has no record (019), how to log Korean
    # composite and shared dishes (020), and how a protein target converts into
    # countable units on a Korean plate (021).
    #
    # VC-E IS A DIFFERENT STANDARD, NOT A LOWER ONE. Every item names its basis
    # and marks the untested part as untested. Item 017 ships a federal survey
    # instrument's five-pass structure and states that its transfer to a
    # chat-based self-log has never been tested. Item 018 is a controlled test of
    # a technique and ships contested because it is one unreplicated study. Items
    # 020 and 021 quote two published Korean professional tools exactly and label
    # the rules built on top of them as conventions rather than findings. Nothing
    # shipped rests on "it is generally recommended".
    #
    # WHERE CRAFT AND EVIDENCE DISAGREE, STATED IN THE OPEN (full detail in the
    # GAPS.md section):
    #   - the flat upward correction factor applied to a client's food log is
    #     standard coaching practice and is REFUSED here: item 007 shows the
    #     bias is differential, and the AMPM validation independently reproduces
    #     that by body-mass group, so a flat factor swaps a known bias for a
    #     hidden one
    #   - the near-universal per-meal even-protein-distribution prescription is
    #     not supported by items 008/009; item 021 keeps a per-meal split but
    #     re-bases it on logging tractability and forbids the physiological
    #     justification
    #   - item 016's convenient reassurance about Korean table accuracy for
    #     energy and protein is true and nearly irrelevant to a real log, because
    #     item 018 shows the dominant error is upstream of the table, in the
    #     portion, on exactly the amorphous staples a Korean plate is built from
    #
    # REFUSALS (recorded rather than dropped; the absences are not all-clears):
    #   - any number for Korean mixed-dish logging error -- the evidence lane
    #     refused it in v13 and craft does not fill an evidence hole by being
    #     confident. Item 020 ships the HANDLING instead
    #   - a shared-dish apportionment rule -- no published method located; item
    #     020 ships a bounded-omission convention chosen for a KNOWN ERROR SIGN
    #     and labels it as the weakest thing in the item
    #   - Korean 눈대중량 / 손대중 portion tables -- searched, and everything
