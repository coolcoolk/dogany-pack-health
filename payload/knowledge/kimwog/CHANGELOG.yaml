    # Duperrier-Simond 2024 Can Vet J). No pet media and no pet-food brand is
    # cited anywhere. 5 of 13 items carry `contested`.
    #
    # THE DOMAIN-SPECIFIC HAZARD, restated because it drove every grading
    # decision. Veterinary evidence is materially thinner than human medicine and
    # this warehouse's other clinical lanes are anchored on literatures that have
    # large randomised trials and formal grading bodies behind them. The
    # intervention studies used here run 6, 9, 16, 28, 46 and 54 animals. The
    # first item shipped (cat/curator-checklist-001) exists solely to state that
    # ceiling, so a curator arriving from sleep-recovery or mental-health does not
    # over-grade this domain by a whole band. The consequence shows in the ladder:
    # the most certain band in this domain is a JURISDICTIONAL LEGAL FACT, not a
    # clinical one, which is an honest reflection of where the certainty is.
    #
    # WHAT WAS RESEARCHED AND REFUSED (headline list; full ledger in GAPS.md):
    #   - the securely-attached percentage from the 2019 cat-attachment study --
    #     full text not retrievable in this pass from publisher or open-access
    #     mirrors, abstract record carries no n and no percentage. NOT shipped,
    #     even though it is the finding this domain would most like to be true.
    #   - "cats are low maintenance" -- refuted, not merely omitted. The
    #     professional guidelines state environmental needs are essential and not
    #     optional. Item 011.
    #   - "cats are aloof / do not form bonds" -- refused in the other direction
    #     too: neither of the two studies supports it, and the 2015 null must not
    #     be cited as evidence of indifference. Item 010.
    #   - the water fountain -- two independent controlled nulls (16 cats
    #     randomised crossover, 9 cats). Item 003.
    #   - "cats are lactose intolerant" as a blanket individual claim -- the one
    #     primary measurement records a subgroup of adults with high lactase, and
    #     measured no clinical endpoint at all. Corrected version shipped. Item 008.
    #   - "fat cats die younger" as the whole story -- the best per-band analysis
