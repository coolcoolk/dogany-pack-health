    #     (Tinsley 2022); meals lower impedance 2-4 h, additive (Slinde 2001);
    #     non-standardised presentation enlarges error (Kerr 2017, Farley
    #     2021 -- BIS, direction only); 24 h standardisation helps (Herberts
    #     2023); weekly weight rhythm ~0.35 pct, heaviest after the weekend
