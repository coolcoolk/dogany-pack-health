    # MENTAL-HEALTH COLLECTION SPRINT (marker: mentalhealth-lane-expansion-008-020).
    # The domain held 7 items, ALL of them methodology: two grading anchors, a
    # no-single-hierarchy rule, a publication-bias rule, one comparator worked
    # example, one contested-intervention worked example, and a synthesised
    # curator checklist. It carried almost no substantive claim a generalist life
    # agent could act on. Thirteen substantive @clinical items authored (008-020);
    # the domain goes 7 -> 20.
    #
    # SCOPE. The consumer is a generalist life agent that sees the owner's daily
    # blocks, energy, sleep and workload. Items were selected for what such an
    # agent can act on from what it OBSERVES: exercise and mood (008, 009),
    # behavioural activation (010), what self-report instruments can and cannot
    # detect (011), where tracking-based inference about mood breaks down (012,
    # 013), sleep and affect (014), workload / recovery / burnout (015, 016),
    # what self-help interventions actually buy (017, 018), what willpower models
    # may not be used for in scheduling (019), and the Korean help-seeking case
    # (020).
    #
    # HARD BOUNDARY HELD. This is a knowledge warehouse for an assistant, not a
    # clinical tool. Nothing here is written as diagnosis, screening, risk
    # assessment or crisis handling. Item 011 is authored deliberately as a
    # MEASUREMENT-LIMITATION finding whose operative content is entirely negative
    # -- no score, threshold or tracked signal may be converted into a claim about
    # a person's state -- and no cut-off recorded in it is to be applied to
    # anyone. Item 010 carries its hard boundary at the top band ABOVE the result:
    # a supervised clinical protocol is not licensed by its resemblance to
    # activity planning. Topics that could only be stated usefully in
    # clinical-advice form were refused and recorded in GAPS.md rather than
    # written in softened form. See the GAPS.md ledger for the full list,
    # including the antidepressant-versus-placebo literature, which was excluded
    # on the boundary rather than for want of sources.
    #
    # SOURCING DISCIPLINE. Every source is a checkable primary publication with
    # authors, journal, volume, pages, year and DOI, resolved through the PubMed
    # E-utilities record or the Crossref work record rather than through a
    # secondary write-up. Three were additionally read at publisher full text
    # (Cregg and Cheavens 2021, Wendsche and Lohmann-Haislah 2017, Rim et al.
    # 2023) and one published correction was resolved separately (BMJ
    # 2024;385:q1024 on item 008). Four of the thirteen carry `contested`. That is
    # a lower share than the sleep sprint's six of ten, and deliberately so: the
    # flag is used where sources genuinely conflict or a live dispute exists
    # (008 unblindable expectancy versus a confidently repeated public claim;
    # 012 four published PNAS commentaries; 016 estimates inconsistent across
    # regions; 019 a theory with active defenders), not where the limitations are
    # the source's own candid assessment of itself. Limitations of that second
    # kind are carried as refraction notes, which is why several items have six.
    #
    # ONE CORRECTION SHIPPED AS A CATCH. Item 017 records that the widely
    # circulated "d = 0.31 down to d = -0.03" gratitude figures belong to Davis
    # et al. 2016 (J Couns Psychol 63:20-31) and are quoted INSIDE the
    # introduction of Cregg and Cheavens 2021, not produced by it. Found by
    # reading the 2021 full text rather than its abstract. Same failure mode
    # relationships-communication/source-misattribution-rule-005 exists to catch.
    #
    # ONE STRUCTURAL FINDING PROMOTED. Comparator collapse -- an effect that
    # survives against a passive control and vanishes against an active one --
    # now appears in FOUR independent literatures in this domain: CBT for anxiety
    # (existing item 004), mindfulness (existing item 006), gratitude and
    # positive-psychology exercises (017), and phone-delivered interventions
    # (018). At four independent appearances it is a lane-level regularity to
    # expect by default, not an intervention-specific quirk, and item 018 records
    # it as such.
    #
