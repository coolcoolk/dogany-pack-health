    # RELATIONSHIPS-COMMUNICATION LANE EXPANSION (marker: relationships-lane-expansion-008-017).
    # The @dyadic lane went from 7 items to 17. The seven pre-existing rows were
    # five refutations, one curator checklist and one therapy-efficacy row -- a
    # domain that could say what is false and almost nothing about what is true.
    # This sprint adds the substantive side: what predicts relationship quality,
    # what the satisfaction trajectory looks like, what the social-connection and
    # mortality literature actually supports at current scale, where perceived
    # and measured closeness diverge, and what a contact-tracking consumer may
    # and may not conclude from its own store.
    #
    # SOURCING DISCIPLINE. Every source is a checkable primary publication with
    # authors, journal, volume, pages, year and DOI, resolved through the PubMed
    # E-utilities record or the publisher DOI (never a secondary write-up, blog,
    # or popular book). Four papers were additionally read at PMC full text to
    # extract exact figures rather than trust an abstract: Heyman and Smith Slep estate-scrub:allow(author surname Smith, not an instance)
    # 2001 (the crossvalidation table), Almaatouq 2016 (the reciprocity counts),
    # Joel 2020 (the sampling-limitation statement), and Holt-Lunstad 2010 (the
    # smoking-comparison wording). 5 of the 10 new items carry `contested`.
    #
    # THE DOMAIN-SPECIFIC HAZARD, restated because it drove every grading
    # decision here: this field has the largest gap in the warehouse between
    # popular authority and evidential strength. The sprint's operating rule was
    # that refusing a famous claim with a stated reason beats shipping it. Seven
    # widely circulating claims were researched and NOT shipped as stated; the
    # full ledger is in GAPS.md.
    #
    # WHAT WAS RESEARCHED AND REFUSED (headline list; full detail in GAPS.md):
    #   - "loneliness is as bad as smoking 15 cigarettes a day" -- the phrasing
    #     could not be located in the text of the paper it is attributed to, and
    #     it is attached to a 2010 effect size the field has since revised down.
    #   - the 50-hour / 200-hour friendship figures -- real study, but Study 1 is
    #     N=355 MTurk adults RETROSPECTIVELY ESTIMATING hours, no threshold tested.
    #   - any contact cadence / frequency rule -- zero primary sources located.
    #     Shipped as an explicit absence row (014) rather than left silent.
    #   - the 150 figure and its 5/15/50 layers -- CIs of 4-520 and 2-336.
    #   - implicit-vs-explicit social support for East Asians -- single small
    #     pre-replication-era lab study, no replication located, Asian-American
    #     students are not Koreans in Korea. Recorded, not shipped.
    #   - "men and women communicate differently" -- refused on Hyde 2005 and
    #     Zell 2015 (106 meta-analyses, mean absolute d = 0.21). No item shipped
    #     because no primary claim in this domain needed one.
    #   - loneliness-reduction intervention effect sizes -- the best source found
    #     (Masi 2011) reports that randomized designs yield SMALLER effects than
    #     pre-post designs. Refused as an actionable recommendation.
    #
    # WHAT THIS SPRINT CLOSED IN THE WAREHOUSE'S OWN LEDGER: item 003 recorded
    # that "the exact 21-43 pct PPV range is NOT verified (see open question)".
    # It is now verified from Heyman and Smith Slep 2001 -- 65.38 pct positive estate-scrub:allow(author surname Smith, not an instance)
    # predictive value in the development sample, 28.81 pct on crossvalidation,
    # 20.99 pct reweighted to true divorce prevalence. Item 011.
    #
    # LOCALE CHECK (mandated for this sprint): the domain splits in half on
    # Korean transferability and the split is itself the finding. The
    # social-isolation and mortality association IS reproduced in Korean primary
    # data (KLoSA n=6,284; a second cohort n=1,033). Every couples/communication
    # finding is Western-sampled -- Joel 2020 states outright that all 43 datasets
    # came from Western countries with no East Asian sample. Transfer there is
    # UNTESTED, not shown to fail. Item 016.
    #
    # Per-item one-liners:
    #   008 social-connection-mortality-magnitude (B/C/D, contested) -- direction
    #       robust across 90 prospective cohorts and 2.2M people (Wang 2023);
    #       magnitude roughly half the 2010 figure everyone quotes. Isolation
    #       1.32, loneliness 1.14. All observational, no dose anywhere.
    #   009 relationship-quality-predictors-joel (B/A) -- Joel 2020 PNAS, 43
    #       datasets / 29 labs. Top predictors are perceptions, not traits; and
    #       the half nobody repeats: CHANGE was unpredictable, under 5 pct of
    #       variance from any combination of self-report.
    #   010 satisfaction-trajectory-duration (B/D) -- Buhler 2021, 165 samples /
    #       165,039 participants. Two curves (age and duration), different
    #       shapes; within-relationship mean change is downward, steepest early.
    #   011 divorce-prediction-crossvalidation (A) -- Heyman 2001 PPV collapse
    #       65.38 -> 28.81 -> 20.99 pct; Kim/Capaldi/Crosby 2007 independent
    #       replication failure, 2 of 22 affective processes predictive.
    #   012 tie-reciprocity-perception-gap (C/D, contested) -- 53 pct of
    #       nominations reciprocal vs 94 pct expected, but n=84 in one classroom;
    #       the number is graded down on purpose. Paired with the liking gap,
    #       which runs the OPPOSITE way for new ties.
    #   013 reach-out-appreciation-gap (B/D) -- the sprint's only experimentally
    #       supported actionable finding. Preregistered experiments plus field
    #       experiments on commuters. Licenses the ACT, not a frequency.
    #   014 contact-cadence-no-evidence (D/C) -- deliberate absence row. No
    #       primary source prescribes a contact frequency. Explicitly NOT a
    #       demonstrated null. Exists as the forcing point that stops a cadence
    #       number being generated from parametric memory at answer time.
    #   015 dunbar-number-not-derivable (B/D, contested) -- Lindenfors 2021, CIs
    #       4-520 and 2-336. No ceiling established; a 115-person roster is not
    #       near capacity because no capacity exists.
    #   016 kr-weird-transfer-gate (C/D, contested, locale KR) -- the mandated
    #       locale check. Health side corroborated in Korean cohorts; couples
    #       side untested. Taylor 2007 recorded as refused, not shipped.
    #   017 network-effect-inference-floor (B) -- Cohen-Cole and Fletcher 2008:
    #       the same standard method finds social contagion for HEIGHT. A
    #       co-occurrence pattern in a personal social graph is a description,
    #       never a mechanism.
    added:
